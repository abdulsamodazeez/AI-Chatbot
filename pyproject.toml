[project]
name = "ai-chatbot"
version = "2.0.0"
description = "Chat with your PDFs: retrieval-augmented question answering with page citations"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
